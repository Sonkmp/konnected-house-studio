<title>Unbroken Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Bebas+Neue&family=League+Gothic&family=Oswald:wght@500;600;700&family=Poppins:wght@400;500;600;700;800;900&family=Averia+Serif+Libre:ital,wght@0,400;0,700;1,400;1,700&family=DM+Serif+Display:ital@0;1&family=Fraunces:ital,opsz,wght@1,9..144,800&family=Instrument+Serif:ital@0;1&family=Montserrat:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: three-pane studio (posts · slide stage · inspector), stacking to one column on phones.
   One deliberate dark look: the studio sits back so the slide colours read true. */
:root{
  color-scheme: dark;
  --bg:#0C0A0A;
  --panel:#151212;
  --panel-2:#1F1A1A;
  --field:#100D0D;
  --line:rgba(255,224,220,.09);
  --line-2:rgba(255,224,220,.18);
  --fg:#F5F0EF;
  --muted:#AB9F9D;
  --dim:#8C8381;
  --brand:#E3252B;
  --brand-ink:#FFFFFF;
  --ok:#46C001;
  --warn:#F2B84B;
  --bad:#FF7A7A;
  --ui:"Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif:"Averia Serif Libre", Georgia, "Times New Roman", serif;
  --r:10px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--ui);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.app{display:flex;flex-direction:column;gap:14px;min-height:100%;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:14px 40px}

/* top bar */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:34px;width:auto;display:block}
.brand .wordmark{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-weight:800;font-size:15px;letter-spacing:.01em}
.brand small{color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.save{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;font-weight:500}
.save i{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block}
.save[data-s="ok"] i{background:var(--ok)}
.save[data-s="busy"] i{background:var(--warn)}
.save[data-s="bad"] i{background:var(--bad)}

.work{display:grid;grid-template-columns:250px minmax(0,1fr) 350px;gap:14px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;min-width:0}
@media (max-width:1220px){.work{grid-template-columns:200px minmax(0,1fr) 330px}}
@media (max-width:820px){.work{grid-template-columns:minmax(0,1fr)}}


/* posts list */
.posts{padding:12px;display:flex;flex-direction:column;gap:10px}
.posts-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.post-list{display:flex;flex-direction:column;gap:2px;max-height:70vh;overflow:auto}
@media (max-width:820px){.post-list{max-height:none;flex-direction:row;overflow-x:auto;padding-bottom:4px}.post-item{min-width:210px}}
.week{font-size:11px;color:var(--dim);font-weight:600;padding:10px 8px 4px;letter-spacing:.06em;text-transform:uppercase}
.post-item{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:start;text-align:left;
  background:transparent;border:0;border-radius:9px;padding:9px 10px}
.post-item:hover{background:var(--panel-2)}
.post-item[aria-current="true"]{background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.dot{width:10px;height:10px;margin-top:4px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb, var(--c) 18%, transparent)}
.pi-main{display:flex;flex-direction:column;min-width:0}
.pi-date{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi-title{font-weight:600;font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pi-meta{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip-st{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:99px;border:1px solid var(--line-2);color:var(--muted)}
.chip-st[data-s="ready"]{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.chip-st[data-s="reel"]{color:var(--fg);border-color:var(--line-2);background:var(--panel-2)}
.chip-st[data-s="posted"]{color:var(--dim);border-color:var(--line);background:transparent}
.newform{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px;background:var(--panel-2);border-radius:10px}
.newform .full{grid-column:1 / -1}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);background:var(--panel-2);
  border-radius:9px;padding:8px 12px;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--brand);font-weight:600;font-size:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
input[type=text],input[type=date],select,textarea{background:var(--field);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;
  color:var(--fg);font-size:13.5px;font-weight:500;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.4}
input[type=range]{width:100%;accent-color:var(--brand)}
input[type=color]{width:34px;height:30px;border:1px solid var(--line-2);border-radius:7px;background:var(--field);padding:2px}

/* stage */
.stage{padding:14px;display:flex;flex-direction:column;gap:14px}
.post-head{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,2fr);gap:10px;align-items:end}
@media (max-width:1220px){.post-head{grid-template-columns:minmax(0,1fr)}}
.title-input{font-size:20px!important;font-weight:700!important;background:transparent!important;border-color:transparent!important;padding:4px 6px!important}
.title-input:hover{border-color:var(--line-2)!important}
.meta-row{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr);gap:10px}
@media (max-width:560px){.meta-row{grid-template-columns:1fr 1fr}.meta-row .f:first-child{grid-column:1 / -1}}
.editor{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:14px;min-height:0}
.editor.single{grid-template-columns:minmax(0,1fr)}
@media (max-width:820px){.editor{grid-template-columns:minmax(0,1fr)}}
.canvas-col{display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0}
.under{display:flex;align-items:center;justify-content:center;gap:8px 16px;flex-wrap:wrap}
.under .viewer-foot{flex-direction:column;gap:2px;text-align:left}
.viewer{display:grid;grid-template-columns:36px minmax(0,1fr) 36px;align-items:center;gap:8px;min-height:0}
.stagebox{display:grid;place-items:center;min-width:0;min-height:0}
.canvas-wrap{justify-self:center;width:100%;max-width:520px;position:relative}
#preview{display:block;width:100%;height:auto;border-radius:6px;background:#000;
  box-shadow:0 30px 60px -30px rgba(0,0,0,.8),0 0 0 1px var(--line);touch-action:none}
#preview.draggable{cursor:grab}
#preview.dragging{cursor:grabbing}
.nav{width:36px;height:36px;border-radius:50%;border:1px solid var(--line-2);background:var(--panel-2);font-size:22px;line-height:1;display:grid;place-items:center}
.nav[disabled]{opacity:.3}
.viewer-foot{display:flex;justify-content:center;gap:14px;color:var(--muted);font-size:12px;flex-wrap:wrap;text-align:center}
.strip{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar .hint{color:var(--dim);font-size:12px}
.toolbar .grow{flex:1 1 auto}
.thumb{flex:0 0 auto;display:flex;flex-direction:column;gap:5px;align-items:center;background:none;border:0;padding:0;color:var(--muted);font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.thumb canvas{width:86px;height:auto;border-radius:4px;display:block;box-shadow:0 0 0 1px var(--line)}
.thumb[aria-current="true"] canvas{box-shadow:0 0 0 2px var(--brand)}
.thumb[aria-current="true"]{color:var(--fg)}
.add-slide{flex:0 0 auto;width:86px;aspect-ratio:1080/1350;border:1px dashed var(--line-2);border-radius:4px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:11.5px;font-weight:600;background:transparent;padding:6px;text-align:center}
.add-slide select{font-size:11px;padding:4px;border-radius:6px}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.actions .hint{margin-right:auto;color:var(--dim);font-size:12px}
.banner{border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 9%,transparent);color:var(--fg);
  border-radius:10px;padding:10px 12px;font-size:12.5px}

.empty-stage{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:28px 10px;max-width:520px}
.empty-stage h2{margin:0;font-size:22px;font-weight:800;text-wrap:balance}
.empty-stage p{margin:0;color:var(--muted)}

/* inspector */
.inspector{padding:0;display:flex;flex-direction:column}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;padding:12px;font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--brand)}
.insp-body{padding:14px;display:flex;flex-direction:column;gap:16px}
.grp{display:flex;flex-direction:column;gap:10px}
.grp h3{margin:0;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.grp + .grp{border-top:1px solid var(--line);padding-top:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--field);border:1px solid var(--line-2);border-radius:9px;padding:3px}
.seg button{flex:1 1 auto;border:0;background:transparent;border-radius:7px;padding:6px 8px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--panel-2);color:var(--fg);box-shadow:0 0 0 1px var(--line-2)}
.count{font-size:11.5px;color:var(--dim);font-weight:600;font-variant-numeric:tabular-nums;align-self:flex-end}
.count.over{color:var(--warn)}
.help{font-size:12px;color:var(--dim);margin:0}
.help code{font-family:inherit;color:var(--muted);background:var(--field);padding:0 4px;border-radius:4px}
.picker{display:flex;flex-direction:column;gap:8px;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px}
.pk-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:var(--fg)}
.drop{display:grid;place-items:center;min-height:86px;border:1px dashed var(--line-2);border-radius:8px;color:var(--muted);font-size:12.5px;
  cursor:pointer;overflow:hidden;text-align:center;padding:8px}
.drop.has{padding:0;min-height:0;border-style:solid}
.drop.has img{display:block;width:100%;height:120px;object-fit:cover}
.drop.over{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,transparent)}
.lib{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.lib button{flex:0 0 auto;padding:0;border:1px solid var(--line-2);border-radius:6px;overflow:hidden;background:none;width:46px;height:46px}
.lib button.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.lib img{width:100%;height:100%;object-fit:cover;display:block}
.sl{display:grid;grid-template-columns:62px minmax(0,1fr) 42px;gap:8px;align-items:center;font-size:12px;color:var(--muted);font-weight:600}
.sl output{font-variant-numeric:tabular-nums;text-align:right;color:var(--fg);font-size:11.5px}
.swatches{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sw{width:26px;height:26px;border-radius:7px;border:1px solid var(--line-2);background:var(--c);padding:0}
.sw.on{box-shadow:0 0 0 2px var(--fg)}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--fg)}
.toggle input{width:16px;height:16px;accent-color:var(--brand)}
.slide-actions{display:flex;flex-wrap:wrap;gap:8px}
label.btn{cursor:pointer}
.fmt{display:flex;gap:6px;flex-wrap:wrap}
.font-pick{display:grid;grid-template-columns:repeat(2, minmax(0,1fr))}
.font-pick button{font-size:14px;color:var(--fg)}
.tpl-grid{display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:8px}
.tpl-grid.two{grid-template-columns:repeat(2, minmax(0,1fr))}
.tpl{display:flex;flex-direction:column;gap:5px;background:var(--field);border:1px solid var(--line-2);border-radius:9px;padding:5px;color:var(--muted);font-size:11px;font-weight:700;text-align:center}
.tpl canvas{width:100%;height:auto;aspect-ratio:3/4;border-radius:5px;display:block}
.tpl.on{border-color:var(--brand);color:var(--fg);box-shadow:0 0 0 1px var(--brand)}
.fmt .btn{font-weight:600}
.pk-actions{display:flex;gap:8px;flex-wrap:wrap}
.photo-bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pb-item{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.pb-item img,.pb-empty{width:34px;height:42px;object-fit:cover;border-radius:5px;display:block;background:var(--field)}
.pb-empty{border:1px dashed var(--line-2)}
.pb-l{font-size:12px;font-weight:700;color:var(--muted)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom, 0px));
  background:var(--panel-2);border:1px solid var(--line-2);color:var(--fg);padding:10px 14px;border-radius:10px;font-size:13px;font-weight:500;
  box-shadow:0 18px 40px -12px rgba(0,0,0,.7);max-width:calc(100% - 32px);z-index:20}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* wider screens: the page stays put and each column scrolls on its own, so the slide stays in view while you edit */
@media (min-width:821px){
  html, body{height:100%}
  .app{height:100%;overflow:hidden;padding-block:14px}
  .work{flex:1 1 auto;min-height:0;align-items:stretch}
  .posts, .stage{min-height:0;overflow-y:auto;overscroll-behavior:contain}
  .stage > *, .posts > *{flex-shrink:0}
  .post-list{flex-shrink:1;min-height:0}
  .post-list{max-height:none}
  .inspector{min-height:0;overflow:hidden}
  .insp-body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain}
  /* the slide fills the height left over; the other slides sit in a column on the right */
  .stage{overflow:hidden}
  .editor{flex:1 1 auto;min-height:320px}
  .canvas-col{height:100%}
  .viewer{flex:1 1 auto}
  .viewer, .stagebox{height:100%}
  .stagebox{container-type:size}
  .canvas-wrap{width:min(100cqw, calc(100cqh * var(--ar)));max-width:none}
  .editor .strip{flex-direction:column;align-items:center;overflow-x:hidden;overflow-y:auto;padding:4px 4px 8px;min-height:0;height:100%;
    border-left:1px solid var(--line);overscroll-behavior:contain}
  .editor .thumb canvas{width:92px}
  .editor .add-slide{width:92px;aspect-ratio:auto;padding:10px 6px}
}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <img src="__LOGO_FULL__" alt="Unbroken Podcast">
      <span class="wordmark"><b>Unbroken Studio</b><small>Carousels · Reel covers</small></span>
    </div>
    <div class="save" id="saveState" data-s="busy" role="status"><i></i><span>Connecting…</span></div>
  </header>

  <div id="banner"></div>

  <main class="work">
    <aside class="panel posts" aria-label="Posts">
      <div class="posts-head">
        <span class="eyebrow">Posts</span>
        <button class="btn sm" id="newPostBtn" aria-expanded="false">+ New post</button>
      </div>
      <form class="newform" id="newForm" hidden>
        <label class="f full">Pillar
          <select id="newDay"></select>
        </label>
        <label class="f full">Post date
          <input type="date" id="newDate">
        </label>
        <label class="f full">Format
          <select id="newFormat"><option value="carousel">Carousel · 1080 × 1350</option><option value="reel">Reel cover · 1080 × 1440</option></select>
        </label>
        <button class="btn primary full" type="submit">Create from template</button>
      </form>
      <div class="post-list" id="postList"></div>
    </aside>

    <section class="panel stage" id="stage" aria-label="Slides"></section>

    <aside class="panel inspector" aria-label="Settings">
      <div class="tabs" role="tablist">
        <button role="tab" id="tabSlide" aria-selected="true">Slide</button>
        <button role="tab" id="tabPost" aria-selected="false">Post</button>
      </div>
      <div class="insp-body" id="insp"></div>
    </aside>
  </main>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(() => {
"use strict";

/* ---------- constants ---------- */
const W = 1080, MARGIN = 100;
const TOP_NUDGE = 14; // label, top badge and logo sit this much lower than the margin line
let H = 1350;
const postH = p => p && p.format === "reel" ? 1440 : 1350;
let M = MARGIN, SAFE_B = 160, IS_REEL = false; // side margin and bottom safe zone, set per post in drawSlide
const LOGO_FULL_SRC = "__LOGO_FULL__";
const LOGO_MARK_SRC = "__LOGO_MARK__";

const UB_RED = "#C9060D";
const BRAND = [
  {n:"White", c:"#FFFFFF"}, {n:"Unbroken Red", c:"#C9060D"}, {n:"Deep Red", c:"#8E0409"},
  {n:"Unbroken Black", c:"#0D0D0D"}, {n:"Charcoal", c:"#1C1919"},
  {n:"KH Sky", c:"#A5E6FE"}, {n:"KH Green", c:"#46C001"}, {n:"KH Dark Green", c:"#3BA101"}, {n:"KH Navy", c:"#002B5B"}
];

const WATCH = "Watch the full conversation on ==Unbroken Podcast==";
const DAYS = {
  mon:{short:"Mon", name:"Monday",    pillar:"Marriage Truths",   accent:"#C9060D", hi:"#C9060D", base:"#0D0D0D", cta:WATCH},
  tue:{short:"Tue", name:"Tuesday",   pillar:"Episode Trailer",   accent:"#C9060D", hi:"#C9060D", base:"#0D0D0D",
       cta:"New episode ==tomorrow==, 10 AM on YouTube"},
  wed:{short:"Wed", name:"Wednesday", pillar:"New Episode",       accent:"#FFFFFF", hi:"#FFFFFF", base:"#8E0409",
       cta:"Watch the full episode on ==YouTube=="},
  thu:{short:"Thu", name:"Thursday",  pillar:"Fathers & Family",  accent:"#C9060D", hi:"#C9060D", base:"#0D0D0D", bw:true, cta:WATCH},
  fri:{short:"Fri", name:"Friday",    pillar:"Clip of the Day",   accent:"#C9060D", hi:"#C9060D", base:"#0D0D0D", cta:WATCH},
  sat:{short:"Sat", name:"Saturday",  pillar:"The Cost of Love",  accent:"#C9060D", hi:"#C9060D", base:"#1C1919", cta:WATCH},
  sun:{short:"Sun", name:"Sunday",    pillar:"Clip of the Day",   accent:"#C9060D", hi:"#C9060D", base:"#0D0D0D", cta:WATCH}
};
const DAY_ORDER = ["mon","tue","wed","thu","fri","sat","sun"];
const LAYOUTS = {photo:"Photo + text", split:"Two stills", step:"Big number", cta:"Closing CTA"};
const STATUS = {draft:"Draft", ready:"Ready", posted:"Posted"};

/* ---------- small utils ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const timers = {}, hist = {};
let histTimer = 0;
function histOf(pid){ return hist[pid] || (hist[pid] = {undo:[], redo:[], last:null}); }
function snapStr(p){ const o = Object.assign({}, p); delete o.updatedAt; return JSON.stringify(o); }
function histInit(pid){ const p = state.posts.get(pid); if (p) histOf(pid).last = snapStr(p); }
function histRecord(pid){
  const p = state.posts.get(pid), h = histOf(pid); if (!p) return;
  const now = snapStr(p);
  if (h.last === null){ h.last = now; return; }
  if (now === h.last) return;
  h.undo.push(h.last); if (h.undo.length > 80) h.undo.shift();
  h.redo = []; h.last = now;
}
function undoRedo(dir){
  const p = cur(); if (!p) return;
  clearTimeout(histTimer); histRecord(p.id);
  const h = histOf(p.id), from = dir < 0 ? h.undo : h.redo, to = dir < 0 ? h.redo : h.undo;
  if (!from.length){ toast(dir < 0 ? "Nothing to undo." : "Nothing to redo."); return; }
  to.push(h.last); h.last = from.pop();
  state.posts.set(p.id, normPost(p.id, JSON.parse(h.last)));
  state.slideIdx = clamp(state.slideIdx, 0, cur().slides.length - 1);
  renderAll(); touch(p.id, false, true);
}
function touch(pid, full, noHist){
  const p = state.posts.get(pid); if (!p) return;
  if (!noHist){ clearTimeout(histTimer); histTimer = setTimeout(() => histRecord(pid), 450); }
  p.updatedAt = Date.now();
  if (state.mode !== "db" || state.readOnly) { renderSave(); return; }
  state.dirty.add(pid); renderSave();
  clearTimeout(timers[pid]); timers[pid] = setTimeout(() => flush(pid), full ? 50 : 800);
}
function cleanPost(p){
  const o = JSON.parse(JSON.stringify(p, (k, v) => (k === "src" && typeof v === "string" && v.startsWith("blob:")) ? undefined : v));
  delete o.id;
  const fix = r => (r && r.id) ? {id: r.id} : null;
  o.photos = (o.photos || []).map(fix).filter(Boolean);
  o.bgImg = fix(o.bgImg);
  o.slides.forEach(s => { s.img = fix(s.img); s.img2 = fix(s.img2); s.bgImg = fix(s.bgImg); });
  return o;
}
async function flush(pid){
  if (state.saving.has(pid)){ timers[pid] = setTimeout(() => flush(pid), 400); return; }
  const p = state.posts.get(pid); if (!p){ state.dirty.delete(pid); renderSave(); return; }
  state.dirty.delete(pid); state.saving.add(pid); renderSave();
  try {
    await state.db.collection("posts").doc(pid).set(cleanPost(p));
    state.saveError = false;
  } catch(e){
    if (e && e.code === "invalid_argument") state.readOnly = true;
    else state.saveError = true;
  } finally {
    state.saving.delete(pid); renderSave();
  }
}
async function removePost(pid){

/* wrap the selected words (or the word at the cursor) in a highlight marker; m = "" clears markers */
function wrapSel(ta, m){
  const v = ta.value; let a = ta.selectionStart, b = ta.selectionEnd;
  if (a === b){ while (a > 0 && /\S/.test(v[a-1])) a--; while (b < v.length && /\S/.test(v[b])) b++; }
  while (a < b && /[\s“"‘(]/.test(v[a])) a++;
  while (b > a && /[\s.,!?;:”"’)…]/.test(v[b-1])) b--;
  if (a === b) return false;
  for (const mk of ["==", "**", "*"]) if (v.slice(Math.max(0, a - mk.length), a) === mk && v.slice(b, b + mk.length) === mk){ a -= mk.length; b += mk.length; break; }
  const inner = v.slice(a, b).replace(/==|\*/g, "");
  const out = m ? m + inner + m : inner;
  ta.value = v.slice(0, a) + out + v.slice(b);
  ta.focus(); ta.setSelectionRange(a, a + out.length);
  ta.dispatchEvent(new Event("input", {bubbles:true}));
  return true;
}

    const th = e.target.closest(".thumb"); if (th) return goSlide(+th.dataset.i);
    if (e.target.closest("#prevSlide")) return goSlide(state.slideIdx - 1);
    if (e.target.closest("#nextSlide")) return goSlide(state.slideIdx + 1);
    if (e.target.closest("#addSlideBtn")){
      const layout = $("#addLayout").value;
      const s = S({layout, headline: layout === "cta" ? DAYS[p.day].cta : layout === "split" ? "Top text" : "New slide text", text2: layout === "split" ? "Bottom text" : "", tag: layout === "step" ? "Step" : "", num: layout === "step" ? String(p.slides.filter(x => x.layout === "step").length + 1) : ""});
      const at = p.slides.length && p.slides[p.slides.length - 1].layout === "cta" && layout !== "cta" ? p.slides.length - 1 : p.slides.length;
      p.slides.splice(at, 0, s); state.slideIdx = at; renderStage(); renderInspector(); touch(p.id); return;
    }
    const clr = e.target.closest('[data-act="clear-img"]');
    if (clr){ const s = curSlide(); if (s){ s[clr.dataset.slot] = null; renderStage(); renderInspector(); touch(p.id); } return; }
    if (e.target.closest("#undoBtn")) return undoRedo(-1);
    if (e.target.closest("#redoBtn")) return undoRedo(1);
    if (e.target.closest("#dlZip")) return exportZip(e.target.closest("#dlZip"));
    if (e.target.closest("#dlSlide")) return exportOne(e.target.closest("#dlSlide"));
  });
  stage.addEventListener("input", e => { if (e.target.dataset.pk) onPostField(e.target); });
  stage.addEventListener("change", e => {
    if (e.target.dataset.file){ addFiles(e.target.files, e.target.dataset.file); e.target.value = ""; return; }
    if (e.target.id === "guidesChk"){ state.guides = e.target.checked; scheduleRender(false); return; }
    if (e.target.dataset.pk === "day") onPostField(e.target);
  });

  /* drag to reposition the photo */
  let drag = null;
  stage.addEventListener("pointerdown", e => {
    if (e.target.id !== "preview") return;
    const s = curSlide(); if (!s || !hasPhoto(s)) return;
    const r = e.target.getBoundingClientRect();
    const which = s.layout === "split" && (e.clientY - r.top) / r.height > .5 ? "2" : "";
    if (!getImg(which ? s.img2 : s.img)) return;
    drag = {x: e.clientX, y: e.clientY, w: r.width, h: r.height, which, fx: s["fx" + which], fy: s["fy" + which], z: s["zoom" + which] || 1};
    e.target.setPointerCapture(e.pointerId); e.target.classList.add("dragging");
  });
  stage.addEventListener("pointermove", e => {
    if (!drag) return; const s = curSlide(); if (!s) return;
    const k = 1.6 / drag.z;
    s["fx" + drag.which] = clamp(drag.fx - (e.clientX - drag.x) / drag.w * k, 0, 1);
    s["fy" + drag.which] = clamp(drag.fy - (e.clientY - drag.y) / drag.h * k * (s.layout === "split" ? 2 : 1), 0, 1);
    scheduleRender(false);
  });
  const end = e => {
    if (!drag) return; drag = null;
    const c = $("#preview"); if (c) c.classList.remove("dragging");
    const p = cur(); if (p){ scheduleRender(true); touch(p.id); if (state.tab === "slide") renderInspector(); }
  };
  stage.addEventListener("pointerup", end); stage.addEventListener("pointercancel", end);

  const insp = $("#insp");
  insp.addEventListener("input", e => {
    const el = e.target;
    if (el.type === "range"){ const o = el.parentElement.querySelector("output"); if (o) o.textContent = fmtSlider(el.dataset.k, +el.value); }
    if (el.dataset.k && state.tab === "slide") return onSlideField(el);
    if (el.dataset.k === "label") return onPostLabel(el);
    if (el.dataset.pk) return onPostField(el);
    if (el.dataset.color){ const p = cur(); p.theme = Object.assign({}, p.theme, {[el.dataset.color]: el.value.toUpperCase()}); renderList(); scheduleRender(true); touch(p.id); }
  });
  insp.addEventListener("change", e => {
    const el = e.target;
    if (el.dataset.actCheck === "topFade"){ const s = curSlide(), p = cur(); if (s){ s.topFade = el.checked ? .55 : 0; renderInspector(); scheduleRender(true); touch(p.id); } return; }
    if (el.dataset.file){ addFiles(el.files, el.dataset.file); el.value = ""; return; }
    if (el.dataset.color) renderInspector();
  });
  insp.addEventListener("click", async e => {
    const p = cur(); if (!p) return;
    const s = curSlide();
    const segBtn = e.target.closest(".seg button");
    if (segBtn && s){
      const key = segBtn.parentElement.dataset.seg, v = segBtn.dataset.v;
      if (key === "hlMode") s.hlStyle = v === "same" ? "same" : (s.hlLast || "bold");
      else if (key === "hlStyle"){ s.hlStyle = v; s.hlLast = v; }
      else if (key === "textOnly") s.textOnly = v === "true";
      else if (key === "bw") s.bw = v === "on" ? true : v === "off" ? false : null;
      else if (key === "tpl"){ s.tpl = v || null; if (v){ s.frame = true; s.hideLabel = true; s.isCover = true; } else { s.frame = false; s.hideLabel = false; } }
      else s[key] = v;
      if (key === "layout" && v === "step" && !s.num) { s.num = "1"; s.tag = s.tag || "Step"; }
      renderInspector(); renderStage(); touch(p.id); return;
    }
    const a = e.target.closest("[data-act]"); if (!a) return;
    const act = a.dataset.act;
    if (act !== "del-slide" && act !== "del-post") state.confirm = null;
    if (act === "arrow-color"){ s.arrowColor = a.dataset.c === "#FFFFFF" ? null : a.dataset.c; renderInspector(); scheduleRender(true); touch(p.id); return; }
    if (act === "label-all"){ const hide = !p.slides.every(x => x.hideLabel); p.slides.forEach(x => { x.hideLabel = hide; }); renderStage(); renderInspector(); touch(p.id); toast(hide ? "Pillar label hidden on every slide." : "Pillar label shown on every slide."); return; }
    if (act === "arrow-all"){ p.slides.forEach(x => { x.arrowColor = s.arrowColor; }); renderInspector(); scheduleRender(true); touch(p.id); toast("Arrow colour applied to every slide."); return; }
    if (act === "use-bg" || act === "clear-bg"){
      const target = a.dataset.scope === "post" ? p : s; if (!target) return;
      target.bgImg = act === "use-bg" ? p.photos[+a.dataset.i] : null;
      renderInspector(); renderStage(); touch(p.id); return;
    }
    if (act === "badge"){ s.badge = a.dataset.v; renderInspector(); scheduleRender(true); touch(p.id); return; }
    if (act === "post-format"){ p.format = a.dataset.v; renderAll(); touch(p.id); return; }
    if (act === "set-color"){ s[a.dataset.key] = a.dataset.c || null; renderInspector(); scheduleRender(true); touch(p.id); return; }
    if (act === "tpl"){ Object.assign(s, clone(REEL_TPLS[a.dataset.v].look), {tpl: a.dataset.v}); renderInspector(); scheduleRender(true); touch(p.id); return; }
    if (act === "save-preset" || act === "clear-preset"){
      const key = presetKey(p), look = act === "save-preset" ? lookOf(s) : null;
      if (look) state.presets[key] = look; else delete state.presets[key];
      if (state.mode === "db" && !state.readOnly){
        const ref = state.db.collection("presets").doc(key);
        try { if (look) await ref.set({look, updatedAt: Date.now()}); else await ref.delete(); }
        catch(err){ toast("Couldn't save the look. Try again."); return; }
      }
      renderInspector(); toast(look ? `New ${presetLabel(key)} will start with this look.` : "Saved look removed."); return;
    }
    if (act === "look-all"){
      let changed = 0;
      p.slides.forEach(x => { if (x === s) return; const was = JSON.stringify(ALL_KEYS.map(k => x[k] ?? null));
        ALL_KEYS.forEach(k => { x[k] = clone({v:s[k]}).v ?? null; });
        if (JSON.stringify(ALL_KEYS.map(k => x[k] ?? null)) !== was) changed++; });
      renderStage(); renderInspector(); touch(p.id, true);
      toast(changed ? `Applied this slide's look to ${changed} other slide${changed > 1 ? "s" : ""}. Undo if you change your mind.` : "Every slide already has this look."); return;
    }
    if (act === "dup-post"){
      const id = `${p.date || "undated"}-${p.day}-${uid().slice(0, 4)}`;
      const c = normPost(id, clone(cleanPost(p))); c.title = p.title + " (copy)"; c.status = "draft";
      c.slides.forEach(x => { x.id = uid(); });
      state.posts.set(id, c); openPost(id); touch(id, true); toast("Post duplicated. Change its date and text."); return;
    }
    if (act === "wrap"){ const ta = document.getElementById(a.dataset.target); if (ta && !wrapSel(ta, a.dataset.m)) toast("Click inside a word, or select some words first."); return; }
    if (act === "box-color"){ s.boxColor = a.dataset.c || null; renderInspector(); scheduleRender(true); touch(p.id); return; }
    if (act === "reset-type"){ Object.assign(s, {scale:1, lh:1, track:0}); renderInspector(); scheduleRender(true); touch(p.id); return; }
    if (act === "use-photo"){ s[a.dataset.slot] = p.photos[+a.dataset.i]; renderInspector(); renderStage(); touch(p.id); }
    else if (act === "clear-img"){ s[a.dataset.slot] = null; renderInspector(); renderStage(); touch(p.id); }
    else if (act === "dup"){ const c = normSlide(clone(Object.assign({}, s, {img: s.img && {...s.img}, img2: s.img2 && {...s.img2}}))); c.id = uid(); p.slides.splice(state.slideIdx + 1, 0, c); state.slideIdx++; renderStage(); renderInspector(); touch(p.id); }
    else if (act === "left" || act === "right"){
      const j = state.slideIdx + (act === "left" ? -1 : 1); if (j < 0 || j >= p.slides.length) return;
      [p.slides[state.slideIdx], p.slides[j]] = [p.slides[j], p.slides[state.slideIdx]]; state.slideIdx = j; renderStage(); renderInspector(); touch(p.id);
    }
    else if (act === "del-slide"){
      if (state.confirm !== "slide"){ state.confirm = "slide"; renderInspector(); return; }
      state.confirm = null;
      if (p.slides.length <= 1){ toast("A post needs at least one slide."); renderInspector(); return; }
      p.slides.splice(state.slideIdx, 1); state.slideIdx = Math.min(state.slideIdx, p.slides.length - 1); renderStage(); renderInspector(); touch(p.id);
    }
    else if (act === "swatch"){ p.theme = Object.assign({}, p.theme, {[a.dataset.key]: a.dataset.c}); renderList(); renderInspector(); scheduleRender(true); touch(p.id); }
    else if (act === "reset-theme"){ p.theme = {}; renderList(); renderInspector(); scheduleRender(true); touch(p.id); }
    else if (act === "lib-remove"){ p.photos.splice(+a.dataset.i, 1); renderInspector(); touch(p.id); }
    else if (act === "copy-caption"){
      try { await navigator.clipboard.writeText(p.caption || ""); toast("Caption copied."); }
      catch(err){ const ta = $("#postCaption"); ta.focus(); ta.select(); toast("Press Ctrl+C or ⌘C to copy the selected caption."); }
    }
    else if (act === "del-post"){
      if (state.confirm !== "post"){ state.confirm = "post"; renderInspector(); return; }
      state.confirm = null; const id = p.id; await removePost(id);
      state.currentId = pickDefaultPost(); state.slideIdx = 0; renderAll(); toast("Post deleted.");
    }
  });
  insp.addEventListener("mousedown", e => { if (e.target.closest(".fmt button")) e.preventDefault(); });
  insp.addEventListener("dragover", e => { const d = e.target.closest("[data-drop]"); if (d){ e.preventDefault(); d.classList.add("over"); } });
  insp.addEventListener("dragleave", e => { const d = e.target.closest("[data-drop]"); if (d) d.classList.remove("over"); });
  insp.addEventListener("drop", e => { const d = e.target.closest("[data-drop]"); if (!d) return; e.preventDefault(); d.classList.remove("over"); addFiles(e.dataTransfer.files, d.dataset.drop); });

  document.addEventListener("keydown", e => {
    if (e.target.closest("input,textarea,select,[contenteditable]")) return;
    const mod = e.metaKey || e.ctrlKey;
    if (mod && (e.key === "z" || e.key === "Z")){ e.preventDefault(); undoRedo(e.shiftKey ? 1 : -1); return; }
    if (mod && (e.key === "y" || e.key === "Y")){ e.preventDefault(); undoRedo(1); return; }
    if (e.key === "ArrowLeft") goSlide(state.slideIdx - 1);
    if (e.key === "ArrowRight") goSlide(state.slideIdx + 1);
  });
}

/* ---------- data ---------- */
function applySnapshot(snap){
  const seen = new Set(); let currentChanged = false;
  snap.docs.forEach(d => {
    seen.add(d.id);
    if (state.dirty.has(d.id) || state.saving.has(d.id)) return;
    const incoming = normPost(d.id, clone(d.data() || {}));
    const prev = state.posts.get(d.id);
    if (!prev) { state.posts.set(d.id, incoming); histOf(d.id).last = snapStr(incoming); if (d.id === state.currentId) currentChanged = true; return; }
    if (prev){
      // keep in-tab photo previews for refs that now carry an id
      const srcs = new Map(); const keep = r => { if (r && r.id && r.src) srcs.set(r.id, r.src); };
      prev.photos.forEach(keep); prev.slides.forEach(s => { keep(s.img); keep(s.img2); });
      const re = r => { if (r && r.id && srcs.has(r.id)) r.src = srcs.get(r.id); };
      incoming.photos.forEach(re); incoming.slides.forEach(s => { re(s.img); re(s.img2); });
      if (JSON.stringify(cleanPost(prev)) === JSON.stringify(cleanPost(incoming))) return;
    }
    state.posts.set(d.id, incoming);
    histOf(d.id).last = snapStr(incoming);
    if (d.id === state.currentId) currentChanged = true;
  });
  for (const id of [...state.posts.keys()]) if (!seen.has(id) && !state.dirty.has(id) && !state.saving.has(id)) { state.posts.delete(id); if (id === state.currentId) currentChanged = true; }
  if (!state.currentId || !state.posts.has(state.currentId)) { state.currentId = pickDefaultPost(); state.slideIdx = 0; currentChanged = true; }
  const p = cur(); if (p) state.slideIdx = clamp(state.slideIdx, 0, Math.max(0, p.slides.length - 1));
  renderList();
  const typing = document.activeElement && document.activeElement.closest && document.activeElement.closest("#insp, .post-head");
  if (currentChanged){ if (typing) scheduleRender(true); else { renderStage(); renderInspector(); } }
  renderSave();
}
async function init(){
  wire(); renderAll();
  const use = window.claude && window.claude.use ? n => window.claude.use(n).catch(() => null) : () => Promise.resolve(null);
  const [db, assets, downloads] = await Promise.all([use("db"), use("assets"), use("downloads"), use("user")]);
  state.assets = assets; state.downloads = downloads;
  if (!db){ state.mode = "local"; state.currentId = pickDefaultPost(); renderAll(); return; }
  state.db = db; state.mode = "db";
  let first = true;
  const timer = setTimeout(() => { state.stale = true; renderSave(); if (first) renderStage(); }, 10000);
  db.collection("presets").onSnapshot(snap => {
    state.presets = {}; snap.docs.forEach(d => { const v = d.data(); if (v && v.look) state.presets[d.id] = v.look; });
    if (state.tab === "slide" && !(document.activeElement && document.activeElement.closest && document.activeElement.closest("#insp"))) renderInspector();
  }, () => {});
  db.collection("posts").onSnapshot(snap => {
    if (!snap.metadata.fromCache){ clearTimeout(timer); state.stale = false; }
    applySnapshot(snap);
    if (first){ first = false; renderAll(); }
  }, err => {
    clearTimeout(timer); state.stale = false;
    if (state.posts.size === 0) state.mode = "local";
    toast("Lost the connection to saved posts. Reload to reconnect."); renderAll();
  });
  renderSave();
}
window.__studio = {state, normPost, openPost, renderAll, templateFor, drawSlide};
init();
})();
</script>
